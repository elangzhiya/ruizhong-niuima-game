<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2f6bff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>重生之我在瑞众保险当牛马</title>
<style>
:root{
  --bg:#f4f6fa; --card:#ffffff; --ink:#1f2733; --sub:#7a8699;
  --line:#eef1f6; --blue:#2f6bff; --blue-l:#eaf0ff;
  --green:#16a37a; --green-l:#e6f7f1;
  --orange:#f0883e; --orange-l:#fff2e8;
  --purple:#8b5cf6; --purple-l:#f2ecff;
  --red:#e25656; --red-l:#ffeded;
  --yellow:#e8a317; --yellow-l:#fff6e0;
  --shadow:0 2px 14px rgba(31,39,51,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif;
  background:var(--bg); color:var(--ink); line-height:1.6;
  padding:18px 14px 40px; -webkit-font-smoothing:antialiased;
}
.wrap{max-width:920px;margin:0 auto}

/* header */
.hero{
  background:linear-gradient(120deg,#2f6bff,#5b8cff);
  color:#fff;border-radius:18px;padding:20px 24px;margin-bottom:14px;
  box-shadow:0 6px 20px rgba(47,107,255,.22);position:relative;overflow:hidden;
}
.hero h1{font-size:21px;font-weight:800;letter-spacing:.5px}
.hero p{font-size:12.5px;opacity:.9;margin-top:3px}
.hero .tag{position:absolute;right:16px;top:16px;background:rgba(255,255,255,.2);
  border-radius:20px;padding:3px 10px;font-size:11px;font-weight:600}

/* generic card */
.card{background:var(--card);border-radius:16px;padding:16px 18px;margin-bottom:12px;box-shadow:var(--shadow)}
.card h2{font-size:13px;color:var(--sub);font-weight:700;letter-spacing:.5px;margin-bottom:12px;
  display:flex;align-items:center;gap:6px}

/* resource grid */
.res-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.res{border-radius:14px;padding:12px 13px;position:relative;overflow:hidden}
.res .ico{font-size:19px;line-height:1}
.res .lbl{font-size:11px;color:var(--sub);margin:6px 0 1px}
.res .val{font-size:19px;font-weight:800}
.res .sub{font-size:10.5px;color:var(--sub);margin-top:2px}
.res.money{background:var(--yellow-l)}
.res.energy{background:var(--orange-l)}
.res.spirit{background:var(--green-l)}
.res.level{background:var(--blue-l)}
.bar{height:5px;border-radius:6px;background:rgba(0,0,0,.07);margin-top:7px;overflow:hidden}
.bar > i{display:block;height:100%;border-radius:6px;transition:width .35s}
.bar.energy > i{background:var(--orange)}
.bar.spirit > i{background:var(--green)}

/* attrs */
.attr-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.attr{display:flex;align-items:center;gap:9px;background:var(--bg);border-radius:12px;padding:9px 11px}
.attr .ai{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-size:15px;flex:none}
.attr .an{font-size:11px;color:var(--sub)}
.attr .av{font-size:15px;font-weight:800}

/* scene bar */
.scene{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.scene .place{font-size:13.5px;font-weight:700}
.idle-pill{font-size:11.5px;padding:4px 11px;border-radius:20px;font-weight:700}
.idle-on{background:var(--green-l);color:var(--green)}
.idle-off{background:#eef1f6;color:var(--sub)}
.mode-row{display:flex;gap:7px;margin-top:11px;flex-wrap:wrap}
.mode{font-size:11.5px;padding:5px 12px;border-radius:20px;border:1px solid var(--line);
  background:#fff;color:var(--sub);cursor:pointer;font-weight:600;transition:.15s}
.mode:hover{border-color:var(--blue)}
.mode.active{background:var(--blue);border-color:var(--blue);color:#fff}

/* actions */
.act-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.act{border:0;background:var(--bg);border-radius:14px;padding:14px 8px;cursor:pointer;
  text-align:center;transition:.15s;font-family:inherit;color:var(--ink)}
.act:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(31,39,51,.09)}
.act .bi{width:42px;height:42px;border-radius:12px;margin:0 auto 8px;display:grid;place-items:center;font-size:20px}
.act .at{font-size:13px;font-weight:700}
.act .ad{font-size:10.5px;color:var(--sub);margin-top:2px;line-height:1.4}
.act:disabled{opacity:.45;cursor:not-allowed;transform:none}
.b-blue .bi{background:var(--blue-l)} .b-green .bi{background:var(--green-l)}
.b-orange .bi{background:var(--orange-l)} .b-purple .bi{background:var(--purple-l)}
.b-yellow .bi{background:var(--yellow-l)} .b-red .bi{background:var(--red-l)}

/* log */
.logbox{max-height:250px;overflow-y:auto;padding-right:4px}
.logline{font-size:12.5px;padding:7px 10px;border-radius:9px;margin-bottom:5px;background:var(--bg)}
.logline .t{color:var(--sub);font-size:10.5px;margin-right:6px}
.logline.evt{background:var(--yellow-l)}
.logline.good{background:var(--green-l)}
.logline.bad{background:var(--red-l)}
.logline.ach{background:var(--purple-l);font-weight:700}

/* modal */
.mask{position:fixed;inset:0;background:rgba(20,28,40,.5);display:none;
  align-items:center;justify-content:center;padding:18px;z-index:50;backdrop-filter:blur(2px)}
.mask.show{display:flex}
.modal{background:#fff;border-radius:18px;width:100%;max-width:540px;max-height:86vh;
  overflow-y:auto;padding:22px;box-shadow:0 18px 50px rgba(0,0,0,.25)}
.modal .mtag{font-size:11px;font-weight:700;color:var(--blue);background:var(--blue-l);
  padding:3px 10px;border-radius:20px;display:inline-block;margin-bottom:10px}
.modal h3{font-size:18px;margin-bottom:10px}
.modal .mtext{font-size:13.5px;color:#4a5566;background:var(--bg);border-radius:12px;
  padding:13px 15px;margin-bottom:14px}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px 14px;
  cursor:pointer;text-align:left;font-family:inherit;transition:.15s;color:var(--ink)}
.opt:hover:not(:disabled){border-color:var(--blue);background:var(--blue-l)}
.opt .ot{font-size:13.5px;font-weight:700}
.opt .od{font-size:11.5px;color:var(--sub);margin-top:3px}
.opt:disabled{opacity:.45;cursor:not-allowed}
.close{float:right;border:0;background:var(--bg);width:28px;height:28px;border-radius:50%;
  cursor:pointer;font-size:15px;color:var(--sub);line-height:1}
.mfoot{font-size:11px;color:var(--sub);text-align:center;margin-top:14px}

/* tabs panel */
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.tab{font-size:12px;padding:6px 13px;border-radius:9px;border:0;background:var(--bg);
  cursor:pointer;font-weight:700;color:var(--sub);font-family:inherit}
.tab.active{background:var(--blue);color:#fff}
.list-item{background:var(--bg);border-radius:11px;padding:10px 13px;margin-bottom:7px;font-size:12.5px}
.list-item .li-t{font-weight:700}
.list-item .li-d{color:var(--sub);font-size:11.5px;margin-top:2px}
.lock{opacity:.5}
.ending-card{border-radius:14px;padding:16px;margin-bottom:10px;border:1px solid var(--line)}
.ending-card.got{background:var(--green-l);border-color:#bfe8d9}
.ending-card .en{font-size:14px;font-weight:800}
.ending-card .ec{font-size:11.5px;color:var(--sub);margin:3px 0}
.ending-card .et{font-size:12px;line-height:1.6}

.foot{text-align:center;font-size:11px;color:var(--sub);margin-top:18px}
.btn-mini{border:0;background:var(--red-l);color:var(--red);border-radius:8px;
  padding:5px 12px;font-size:11px;cursor:pointer;font-weight:700;font-family:inherit}

/* bottom action bar (mobile only) */
.bottom-bar{display:none}

/* 触摸友好：全局点击高亮与点击延迟 */
*{ -webkit-tap-highlight-color:transparent; }
button{ touch-action:manipulation; }

@media(max-width:640px){
  body{
    padding:10px 10px calc(84px + env(safe-area-inset-bottom));
    -webkit-text-size-adjust:100%;
  }
  .wrap{max-width:100%}

  /* hero */
  .hero{border-radius:14px;padding:15px 16px 14px;margin-bottom:10px;
    padding-top:calc(15px + env(safe-area-inset-top))}
  .hero h1{font-size:17px;line-height:1.3;padding-right:96px}
  .hero p{font-size:11px;line-height:1.45;margin-top:5px}
  .hero .tag{font-size:9px;right:10px;top:calc(12px + env(safe-area-inset-top));padding:3px 7px}

  /* cards */
  .card{border-radius:14px;padding:13px 13px;margin-bottom:10px}
  .card h2{font-size:12px;margin-bottom:10px}

  /* resource grid: 2x2 */
  .res-grid{grid-template-columns:repeat(2,1fr);gap:8px}
  .res{padding:10px 11px;border-radius:12px}
  .res .ico{font-size:17px}
  .res .lbl{font-size:10px;margin:4px 0 0}
  .res .val{font-size:18px}
  .res .sub{font-size:9.5px}

  /* attrs: 2x2 */
  .attr-grid{grid-template-columns:repeat(2,1fr);gap:8px}
  .attr{padding:8px 9px;gap:8px}
  .attr .ai{width:28px;height:28px;font-size:14px}

  /* scene */
  .scene .place{font-size:12.5px}
  .mode-row{gap:6px}
  .mode{font-size:11px;padding:7px 11px;min-height:34px}

  /* action grid: 3x2, larger touch targets */
  .act-grid{grid-template-columns:repeat(3,1fr);gap:8px}
  .act{padding:11px 4px;border-radius:12px;min-height:74px}
  .act .bi{width:36px;height:36px;font-size:18px;margin-bottom:5px}
  .act .at{font-size:11.5px}
  .act .ad{font-size:9px;line-height:1.3}

  /* log */
  .logbox{max-height:210px}
  .logline{font-size:12px;padding:7px 9px}

  /* modal -> bottom sheet */
  .mask{padding:0;align-items:flex-end}
  .modal{
    max-width:100%;width:100%;max-height:88vh;
    border-radius:20px 20px 0 0;
    padding:20px 18px calc(20px + env(safe-area-inset-bottom));
    animation:sheetUp .22s ease-out;
  }
  @keyframes sheetUp{from{transform:translateY(24px);opacity:.6}to{transform:translateY(0);opacity:1}}
  .modal h3{font-size:17px}
  .modal .mtext{font-size:13px;padding:12px}
  /* bigger option buttons for thumb */
  .opt{padding:14px;border-radius:13px;min-height:54px}
  .opt .ot{font-size:14px}
  .opt .od{font-size:12px}
  /* tabs allow horizontal scroll on narrow screens */
  .tabs{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:4px}
  .tab{white-space:nowrap;padding:8px 12px;min-height:36px;font-size:12px}
  .close{width:32px;height:32px}
  .list-item{padding:11px 12px}
  .ending-card{padding:14px}

  /* bottom bar visible */
  .bottom-bar{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:6px;
    position:fixed;left:0;right:0;bottom:0;z-index:40;
    padding:8px 8px calc(8px + env(safe-area-inset-bottom));
    background:rgba(255,255,255,.96);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    border-top:1px solid var(--line);
    box-shadow:0 -2px 14px rgba(31,39,51,.07);
  }
  .bb{
    border:0;background:var(--bg);border-radius:12px;
    padding:7px 2px 6px;min-height:56px;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
    font-family:inherit;color:var(--ink);
  }
  .bb .bbi{font-size:19px;line-height:1}
  .bb .bbt{font-size:10px;font-weight:700;white-space:nowrap}
  .bb:active{transform:scale(.94)}
  .bb.primary{background:var(--blue);color:#fff}
  .bb:disabled{opacity:.45}
  .foot{display:none}
}

/* very small screens */
@media(max-width:360px){
  .hero h1{font-size:15.5px}
  .res .val{font-size:16px}
  .act .bi{width:32px;height:32px;font-size:16px}
  .act{padding:9px 3px;min-height:68px}
  .bb .bbi{font-size:17px}
  .bb .bbt{font-size:9px}
}
</style>
</head>
<body>
<div class="wrap">

  <div class="hero">
    <span class="tag">🐾 牛马求生系统 v3.2</span>
    <h1>重生之我在瑞众保险当牛马</h1>
    <p>上一世累死在工位，这一世——是卷死自己，还是笑着摸鱼？</p>
  </div>

  <div class="card">
    <h2>📊 生存状态</h2>
    <div class="res-grid">
      <div class="res money">
        <div class="ico">💰</div>
        <div class="lbl">工资</div>
        <div class="val" id="v-money">0</div>
        <div class="sub">元 · 底薪+佣金</div>
      </div>
      <div class="res energy">
        <div class="ico">⚡</div>
        <div class="lbl">精力</div>
        <div class="val" id="v-energy">100<span style="font-size:12px;color:#7a8699">/100</span></div>
        <div class="bar energy"><i id="b-energy" style="width:100%"></i></div>
      </div>
      <div class="res spirit">
        <div class="ico">🧠</div>
        <div class="lbl">精神</div>
        <div class="val" id="v-spirit">100<span style="font-size:12px;color:#7a8699">/100</span></div>
        <div class="bar spirit"><i id="b-spirit" style="width:100%"></i></div>
      </div>
      <div class="res level">
        <div class="ico">📊</div>
        <div class="lbl">等级</div>
        <div class="val" id="v-level">Lv1</div>
        <div class="sub" id="v-rank">实习牛马</div>
      </div>
    </div>
    <div style="margin-top:12px;display:flex;align-items:center;gap:9px">
      <div style="font-size:11px;color:var(--sub);white-space:nowrap">经验</div>
      <div class="bar" style="flex:1;margin:0"><i id="b-exp" style="width:0%;background:var(--blue)"></i></div>
      <div style="font-size:11px;color:var(--sub)" id="v-exp">0/60</div>
    </div>
  </div>

  <div class="card">
    <h2>🎯 四大属性</h2>
    <div class="attr-grid">
      <div class="attr"><div class="ai" style="background:var(--blue-l)">🎯</div><div><div class="an">执行力</div><div class="av" id="v-exec">5</div></div></div>
      <div class="attr"><div class="ai" style="background:var(--green-l)">🔧</div><div><div class="an">专业力</div><div class="av" id="v-prof">5</div></div></div>
      <div class="attr"><div class="ai" style="background:var(--orange-l)">😊</div><div><div class="an">情商</div><div class="av" id="v-eq">5</div></div></div>
      <div class="attr"><div class="ai" style="background:var(--purple-l)">🍀</div><div><div class="an">运气</div><div class="av" id="v-luck">5</div></div></div>
    </div>
  </div>

  <div class="card">
    <div class="scene">
      <div class="place">📍 <span id="v-scene">瑞众保险办公区</span></div>
      <div>
        <span class="idle-pill" id="v-idle">挂机：关闭</span>
      </div>
    </div>
    <div class="mode-row">
      <span style="font-size:11px;color:var(--sub);align-self:center;margin-right:2px">挂机模式</span>
      <button class="mode" data-mode="money">💰 赚钱优先</button>
      <button class="mode active" data-mode="balance">⚖️ 均衡模式</button>
      <button class="mode" data-mode="spirit">🧘 保精神优先</button>
    </div>
  </div>

  <div class="card">
    <h2>🎮 可操作选项</h2>
    <div class="act-grid">
      <button class="act b-blue" id="a-work"><div class="bi">💼</div><div class="at">主动展业</div><div class="ad">耗精力换高佣金</div></button>
      <button class="act b-green" id="a-moyu"><div class="bi">🐟</div><div class="at">带薪摸鱼</div><div class="ad">回精神，混点工资</div></button>
      <button class="act b-orange" id="a-tidy"><div class="bi">🧹</div><div class="at">整理工作</div><div class="ad">3轮内失误率减半</div></button>
      <button class="act b-purple" id="a-bag"><div class="bi">🎒</div><div class="at">打开背包</div><div class="ad">使用免费道具</div></button>
      <button class="act b-yellow" id="a-task"><div class="bi">📋</div><div class="at">任务成就</div><div class="ad">看看进度</div></button>
      <button class="act b-red" id="a-idle"><div class="bi">🔁</div><div class="at">切换挂机</div><div class="ad">开/关自动打工</div></button>
    </div>
  </div>

  <div class="card">
    <h2>📜 职场日志</h2>
    <div class="logbox" id="logbox"></div>
  </div>

  <div class="foot">纯文字放置小游戏 · 进度自动保存在本机浏览器 · 无氪金无广告</div>
</div>

<!-- bottom quick bar (mobile) -->
<div class="bottom-bar">
  <button class="bb primary" id="bb-work"><span class="bbi">💼</span><span class="bbt">主动展业</span></button>
  <button class="bb" id="bb-moyu"><span class="bbi">🐟</span><span class="bbt">带薪摸鱼</span></button>
  <button class="bb" id="bb-bag"><span class="bbi">🎒</span><span class="bbt">背包</span></button>
  <button class="bb" id="bb-idle"><span class="bbi">🔁</span><span class="bbt" id="bb-idle-t">开挂机</span></button>
</div>

<!-- event modal -->
<div class="mask" id="m-event"><div class="modal">
  <span class="mtag" id="e-cat">随机事件</span>
  <h3 id="e-title"></h3>
  <div class="mtext" id="e-text"></div>
  <div class="opts" id="e-opts"></div>
  <div class="mfoot">选择后立即结算 · 没有绝对最优解</div>
</div></div>

<!-- panel modal -->
<div class="mask" id="m-panel"><div class="modal">
  <button class="close" id="p-close">✕</button>
  <div class="tabs">
    <button class="tab active" data-tab="bag">🎒 背包</button>
    <button class="tab" data-tab="ach">🏆 成就</button>
    <button class="tab" data-tab="rank">📊 职级</button>
    <button class="tab" data-tab="end">🏁 结局</button>
    <button class="tab" data-tab="help">❓ 帮助</button>
  </div>
  <div id="p-body"></div>
</div></div>

<!-- result / ending modal -->
<div class="mask" id="m-result"><div class="modal" style="text-align:center">
  <div id="r-content"></div>
  <button class="opt" id="r-btn" style="margin-top:16px;text-align:center">继续</button>
</div></div>

/* ============ 常量 ============ */
const KEY='ruizhong_niuima_save_v1';
const RANKS=[

];

  '精修简历':{ico:'📄',d:'跳槽/创业类事件成功率大幅提升'},
  '领导好感卡':{ico:'💳',d:'考核类事件直接获得正向结果'},
};
const TICK=2000; // 每轮2秒
const OFFLINE_CAP_H=8;
const EXPBase=lv=>30+lv*15;

/* ============ 30 条随机事件 ============ */

/* ============ 状态 ============ */
function fresh(){
  return {
    money:0,energy:100,spirit:100,exp:0,level:1,
    exec:5,prof:5,eq:5,luck:5,
    bag:{'冰美式':1,'请假条':1,'甩锅宝典':0,'摸鱼耳机':0,'精修简历':0,'领导好感卡':0},
    ach:[], gotEnd:[],
    stats:{idleTicks:0,moyu:0,work:0,backpot:0,perfect:0,overtime:0,good:0,
           consecIdle:0,maxMoney:0,lowSpirit:0,failCheck:0,minSpirit:100,noWork:0},
    flags:{}, mode:'balance', idle:false, lastTick:Date.now(),
    buffs:{tidy:0,earphone:0}, ending:null, lastEvent:-99, eventCount:0,
    log:[]
  };
}
let S=fresh();

function load(){
  try{
    const raw=localStorage.getItem(KEY);
    if(raw){const d=JSON.parse(raw);S=Object.assign(fresh(),d);
      S.stats=Object.assign(fresh().stats,d.stats||{});
      S.buffs=Object.assign(fresh().buffs,d.buffs||{});
      S.flags=Object.assign({},d.flags||{});
      S.bag=Object.assign(fresh().bag,d.bag||{});
    }
  }catch(e){console.warn('读档失败',e)}
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function log(msg,cls){
  const d=new Date();
  const ts=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
  S.log.unshift({t:ts,m:msg,c:cls||''});
  if(S.log.length>60)S.log.length=60;
}

/* ============ 计算 ============ */
function rank(){
  let r=RANKS[0];
  for(const x of RANKS) if(S.level>=x.lv) r=x;
  return r;
}
function checkLevelUp(){
  let up=false;
  while(S.exp>=EXPBase(S.level)){
    S.exp-=EXPBase(S.level); S.level++; up=true;
    log(`🎉 升级！现在是 Lv${S.level} ${rank().name}，解锁新场景：${rank().scene}`,'ach');
  }
  if(up){ save(); }
}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function apply(e){
  if(!e)return;
  if(e.money){S.money+=e.money;S.stats.maxMoney=Math.max(S.stats.maxMoney,S.money)}
  if(e.energy)S.energy=clamp(S.energy+e.energy,0,100);
  if(e.spirit)S.spirit=clamp(S.spirit+e.spirit,0,100);
  if(e.exp)S.exp+=e.exp;
  if(e.exec)S.exec=Math.max(0,S.exec+e.exec);
  if(e.prof)S.prof=Math.max(0,S.prof+e.prof);
  if(e.eq)S.eq=Math.max(0,S.eq+e.eq);
  if(e.luck)S.luck=Math.max(0,S.luck+e.luck);
  S.stats.minSpirit=Math.min(S.stats.minSpirit,S.spirit);
  checkLevelUp();
}
function applyStats(s){
  if(!s)return;
  for(const k in s){ if(typeof s[k]==='number' && k in S.stats) S.stats[k]+=s[k]; }
}
function applyFlags(f){ if(f)for(const k in f)S.flags[k]=f[k]; }
function effectText(e){
  if(!e)return '';
  const map={money:'工资',energy:'精力',spirit:'精神',exp:'经验',exec:'执行力',prof:'专业力',eq:'情商',luck:'运气'};
  const parts=[];
  for(const k in e){if(map[k]&&e[k])parts.push(`${map[k]}${e[k]>0?'+':''}${e[k]}`)}
  return parts.join(' ');
}

/* ============ 挂机 tick ============ */
function modeGain(){
  const exBonus=1+S.exec*0.02;
  let g={money:0,exp:0,energy:0,spirit:0};
  if(S.mode==='money') g={money:Math.round(40*exBonus),exp:8,energy:-3,spirit:-6};
  else if(S.mode==='spirit') g={money:Math.round(15*exBonus),exp:5,energy:2,spirit:8};
  else g={money:Math.round(28*exBonus),exp:7,energy:0,spirit:1};
  if(S.buffs.earphone>0 && g.spirit<0) g.spirit=Math.ceil(g.spirit/2);
  return g;
}
function doTick(offline){
  if(!offline){
    // 精神过低计时
    if(S.spirit<=0)S.stats.lowSpirit++; else S.stats.lowSpirit=0;
    // 失误判定（精神<30）
    let failRate=S.spirit<30?0.4:0;
    if(S.buffs.tidy>0)failRate/=2;
    const g=modeGain();
    let money=g.money;
    const fail=Math.random()<failRate;
    if(fail){ money=Math.round(money/2); S.stats.failCheck++; }
    apply({money,exp:g.exp,energy:g.energy,spirit:g.spirit});
    S.stats.idleTicks++; S.stats.consecIdle++; S.stats.noWork++;
    if(S.buffs.tidy>0)S.buffs.tidy--;
    if(S.buffs.earphone>0)S.buffs.earphone--;
    // 随机事件
    if(S.eventCount>=0 && S.stats.idleTicks-S.lastEvent>=12 && Math.random()<0.075){
      S.lastEvent=S.stats.idleTicks; S.eventCount++;
      setTimeout(showEvent,300);
    }
    checkAch(); checkEnd();
  }
  render();
}
function offlineGain(){
  const hours=Math.min((Date.now()-S.lastTick)/3600000,OFFLINE_CAP_H);
  if(hours<0.02)return;
  const rounds=Math.floor(hours*3600000/TICK);
  if(rounds<1)return;
  const g=modeGain();
  const money=g.money*rounds;
  const exp=g.exp*rounds;
  apply({money,exp});
  S.stats.idleTicks+=rounds;
  log(`😴 离线 ${hours.toFixed(1)} 小时，牛马自动搬砖：工资+${money} 经验+${exp}${hours>=OFFLINE_CAP_H?'（已达8小时上限）':''}`,'good');
}
function loop(){
  if(S.idle && !document.querySelector('.mask.show')) doTick(false);
  S.lastTick=Date.now();
  save();
}

/* ============ 事件弹窗 ============ */
function rollEvent(){
  const pool=EVENTS;
  return pool[Math.floor(Math.random()*pool.length)];
}
function showEvent(){
  const ev=rollEvent();
  const box=document.getElementById('e-opts');
  document.getElementById('e-cat').textContent='【'+ev.cat+'】';
  document.getElementById('e-title').textContent=ev.title;
  document.getElementById('e-text').textContent=ev.text;
  box.innerHTML='';
  ev.opts.forEach((op,i)=>{
    const b=document.createElement('button');
    b.className='opt';
    const need=op.need;
    const has=!need||S.bag[need]>0;
    b.disabled=!has;
    b.innerHTML=`<div class="ot">${String.fromCharCode(65+i)}. ${op.t}${need?` <span style="color:#2f6bff">[${ITEMS[need].ico}${need}]</span>`:''}</div>
      <div class="od">${op.d}${!has?' · 背包中没有该道具':''}</div>`;
    b.onclick=()=>resolveEvent(ev,op,need);
    box.appendChild(b);
  });
  document.getElementById('m-event').classList.add('show');
}
function chance(k,boost){
  const attr=S[k]||5;
  let p=0.5 + attr*(k==='luck'?0.03:k==='exec'?0.02:0.04) + (boost||0) + (S.flags.resume?0.15:0);
  if(S.flags.resume && k==='luck') S.flags.resume=0;
  return Math.random()<clamp(p,0.05,0.95);
}
function resolveEvent(ev,op,need){
  if(need){S.bag[need]--;}
  let ok=true, detail='';
  if(op.c){
    ok=chance(op.c.k,op.c.boost);
    apply(ok?op.c.ok:op.c.no);
    applyStats(ok?op.c.sok:op.c.sno);
    applyFlags(ok?op.c.fok:op.c.fno);
    if(op.c.k==='prof'&&!ok)S.stats.failCheck++;
    if(op.c.k==='eq'&&ok)S.stats.good++;
    detail=ok?'✅ 判定成功':'❌ 判定失败';
  }else{
    apply(op.e);
  }
  applyStats(op.s); applyFlags(op.f);
  if(op.e&&op.e.eq>0)S.stats.good+=1;
  document.getElementById('m-event').classList.remove('show');
  const gained=op.e?effectText(op.e):(op.c?effectText(ok?op.c.ok:op.c.no):'');
  log(`【${ev.title}】${op.t} → ${detail} ${gained}`,ok?'evt':'evt');
  checkAch(); checkEnd(); save(); render();
  if(S.ending) showEnding(S.ending);
}

/* ============ 操作 ============ */
function actWork(){
  if(S.energy<20){toastResult('⚡ 精力不足，先摸鱼或休息吧','当前精力低于20，无法主动展业。试试带薪摸鱼或开启挂机恢复。');return}
  apply({energy:-20,spirit:-5});
  let money=Math.round(50*(1+S.exec*0.02));
  let failRate=S.spirit<30?0.4:0;
  if(S.buffs.tidy>0)failRate/=2;
  let fail=Math.random()<failRate;
  if(fail){money=Math.round(money/2);apply({spirit:-10});S.stats.failCheck++;}
  apply({money,exp:12});
  S.stats.work++; S.stats.consecIdle=0; S.stats.noWork=0;
  log(`💼 主动展业${fail?'（精神不济翻车了，佣金减半）':''}：工资+${money} 经验+12`,fail?'bad':'good');
  checkAch();checkEnd();save();render();
  if(S.ending)showEnding(S.ending);
}
function actMoyu(){
  apply({spirit:15,energy:5,money:5,exp:2});
  S.stats.moyu++;
  let caught=false;
  if(Math.random()<0.12){apply({spirit:-10});caught=true;}
  log(`🐟 带薪摸鱼：精神+15 工资+5${caught?'（哎哟，被主管瞥见一眼，精神-10）':''}`,'good');
  checkAch();checkEnd();save();render();
  if(S.ending)showEnding(S.ending);
}
function actTidy(){
  apply({energy:-5,spirit:3,exp:3});
  S.buffs.tidy=3;
  log('🧹 整理工作：获得【条理】buff，接下来3轮失误率减半','good');
  save();render();
}
function toggleIdle(){
  S.idle=!S.idle;
  S.lastTick=Date.now();
  log(S.idle?'🔁 挂机已开启，牛马开始自动搬砖':'⏸ 挂机已关闭','');
  save();render();
}

/* ============ 背包使用 ============ */
function useItem(name){
  if(!S.bag[name])return;
  S.bag[name]--;
  let msg='';
  if(name==='冰美式'){apply({energy:40});msg='🧊 冰美式下肚，瞬间清醒：精力+40'}
  else if(name==='请假条'){msg='📝 请假条已放入背包，将在加班事件中自动免疫'}
  else if(name==='甩锅宝典'){msg='📖 甩锅宝典已备好，人际冲突事件自动规避'}
  else if(name==='摸鱼耳机'){S.buffs.earphone=10;msg='🎧 戴上摸鱼耳机，接下来10轮挂机精神消耗减半'}
  else if(name==='精修简历'){msg='📄 精修简历已备好，跳槽类事件成功率大幅提升'}
  else if(name==='领导好感卡'){msg='💳 领导好感卡已备好，考核类事件直接正向'}
  log(msg,'good');
  save();renderPanel();render();
}

/* ============ 成就 / 结局检查 ============ */
function checkAch(){
  ACHS.forEach(a=>{
    if(S.ach.indexOf(a.id)<0 && a.chk(S)){
      S.ach.push(a.id);
      apply(a.r);
      log(`🏆 成就达成【${a.n}】：${a.d}！永久属性提升`,'ach');
    }
  });
}
function checkEnd(){
  if(S.ending)return;
  for(const e of ENDS){
    if(!S.gotEnd.includes(e.id) && e.chk(S)){
      S.ending=e.id;
      S.gotEnd.push(e.id);
      S.flags.reborn=false;
      apply({exec:1,prof:1,eq:1,luck:1});
      log(`🏁 达成结局【${e.n}】`,'ach');
      save();render();
      setTimeout(()=>showEnding(e),200);
      break;
    }
  }
}
function showEnding(e){
  document.getElementById('r-content').innerHTML=`
    <div style="font-size:34px;margin-bottom:6px">🏁</div>
    <div style="font-size:12px;color:#7a8699">达成结局</div>
    <h3 style="font-size:19px;margin:6px 0 10px">${e.n}</h3>
    <div class="mtext" style="text-align:left">${e.t}</div>
    <div style="font-size:11.5px;color:#7a8699">达成条件：${e.c}</div>`;
  const btn=document.getElementById('r-btn');
  btn.textContent='再来一世（保留属性，触发轮回结局）';
  btn.onclick=()=>{
    document.getElementById('m-result').classList.remove('show');
    reborn();
  };
  document.getElementById('m-result').classList.add('show');
}
function reborn(){
  const keep={exec:S.exec,prof:S.prof,eq:S.eq,luck:S.luck,ach:S.ach,gotEnd:S.gotEnd};
  const st={moyu:S.stats.moyu,work:S.stats.work,backpot:S.stats.backpot};
  S=fresh();
  S.exec=keep.exec;S.prof=keep.prof;S.eq=keep.eq;S.luck=keep.luck;
  S.ach=keep.ach;S.gotEnd=keep.gotEnd;
  S.stats.moyu=st.moyu;S.stats.work=st.work;S.stats.backpot=st.backpot;
  S.flags.reborn=true;
  log('🔄 一轮轮回结束。闹钟响起，你又站在了瑞众保险的入职第一天……','ach');
  setTimeout(()=>{checkEnd();save();render();if(S.ending)showEnding(ENDS.find(x=>x.id==='reborn'))},100);
}
function toastResult(title,body){
  document.getElementById('r-content').innerHTML=`<div style="font-size:30px">⚡</div><h3 style="font-size:17px;margin:6px 0">${title}</h3><div style="font-size:12.5px;color:#7a8699">${body}</div>`;
  const btn=document.getElementById('r-btn');
  btn.textContent='知道了';
  btn.onclick=()=>document.getElementById('m-result').classList.remove('show');
  document.getElementById('m-result').classList.add('show');
}

/* ============ 面板 ============ */
function renderPanel(tab){
  const body=document.getElementById('p-body');
  let h='';
  if(tab==='bag'){
    h='<div style="font-size:11.5px;color:#7a8699;margin-bottom:10px">所有道具免费获取，通过事件/任务/成就掉落。点击使用。</div>';
    for(const k in ITEMS){
      const n=S.bag[k];
      h+=`<div class="list-item ${n?'':'lock'}">
        <div class="li-t">${ITEMS[k].ico} ${k} <span style="color:#2f6bff">×${n}</span></div>
        <div class="li-d">${ITEMS[k].d}</div>
        ${n?`<button class="tab" style="margin-top:7px;background:#2f6bff;color:#fff" data-use="${k}">使用</button>`:''}
      </div>`;
    }
  }else if(tab==='ach'){
    h='';
    ACHS.forEach(a=>{
      const got=S.ach.includes(a.id);
      h+=`<div class="list-item ${got?'':'lock'}">
        <div class="li-t">${got?'🏆':'🔒'} ${a.n}</div>
        <div class="li-d">${a.d} · 奖励：${effectText(a.r)}</div></div>`;
    });
    h+=`<div style="font-size:11.5px;color:#7a8699;margin-top:8px">已达成 ${S.ach.length}/${ACHS.length}</div>`;
  }else if(tab==='rank'){
    h='';
    RANKS.forEach(r=>{
      const cur=S.level>=r.lv;
      h+=`<div class="list-item ${cur?'':'lock'}">
        <div class="li-t">${cur?'✅':'🔒'} Lv${r.lv} ${r.name}</div>
        <div class="li-d">场景：${r.scene}</div></div>`;
    });
    h+=`<div class="list-item"><div class="li-d">当前 Lv${S.level} · 距离下一级还需 ${Math.max(0,EXPBase(S.level)-S.exp)} 经验</div></div>`;
  }else if(tab==='end'){
    h='<div style="font-size:11.5px;color:#7a8699;margin-bottom:10px">共10种结局，达成后保留记录。点击可查看已达成结局文案。</div>';
    ENDS.forEach(e=>{
      const got=S.gotEnd.includes(e.id);
      h+=`<div class="ending-card ${got?'got':''}" data-end="${e.id}" style="cursor:pointer">
        <div class="en">${got?'🏁':'❔'} ${got?e.n:'未解锁结局'}</div>
        <div class="ec">${e.c}</div>
        ${got?`<div class="et">${e.t}</div>`:''}
      </div>`;
    });
  }else if(tab==='help'){
    h=`<div style="font-size:12.5px;line-height:1.9;color:#4a5566">
      <b>玩法说明</b><br>
      · 开启挂机后，每2秒自动结算一轮，产出工资和经验。<br>
      · 离线也生效，最多累计8小时收益。<br>
      · 三种挂机模式：赚钱优先 / 均衡 / 保精神优先。<br>
      · 精神低于30时失误概率大幅上升；主动打工、整理工作可降低风险。<br>
      · 挂机中会随机弹出职场事件，选择立即结算，无绝对最优解。<br>
      · 道具全部免费，从事件/任务/成就获取。<br>
      · 升级解锁新场景与事件池；达成条件触发10种结局之一。<br>
      <br><b>存档</b>：自动保存在本机浏览器，换设备不同步。<br>
      <br><button class="btn-mini" id="reset-btn">⚠ 清空存档重开</button>
    </div>`;
  }
  body.innerHTML=h;
  body.querySelectorAll('[data-use]').forEach(b=>b.onclick=()=>useItem(b.dataset.use));
  body.querySelectorAll('[data-end]').forEach(c=>c.onclick=()=>{
    if(!S.gotEnd.includes(c.dataset.end))return;
    const e=ENDS.find(x=>x.id===c.dataset.end);
    toastResult(e.n,e.t);
  });
  const rb=document.getElementById('reset-btn');
  if(rb)rb.onclick=()=>{
    if(confirm('确定清空存档？此操作不可撤销。')){
      localStorage.removeItem(KEY);S=fresh();save();render();
      document.getElementById('m-panel').classList.remove('show');
      location.reload();
    }
  };
}
function openPanel(tab){
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.tab===tab));
  renderPanel(tab);
  document.getElementById('m-panel').classList.add('show');
}

/* ============ 渲染 ============ */
function render(){
  document.getElementById('v-money').textContent=S.money.toLocaleString('zh-CN');
  document.getElementById('v-energy').innerHTML=`${Math.round(S.energy)}<span style="font-size:12px;color:#7a8699">/100</span>`;
  document.getElementById('v-spirit').innerHTML=`${Math.round(S.spirit)}<span style="font-size:12px;color:#7a8699">/100</span>`;
  document.getElementById('b-energy').style.width=S.energy+'%';
  document.getElementById('b-spirit').style.width=S.spirit+'%';
  document.getElementById('v-level').textContent='Lv'+S.level;
  document.getElementById('v-rank').textContent=rank().name;
  document.getElementById('v-exec').textContent=S.exec;
  document.getElementById('v-prof').textContent=S.prof;
  document.getElementById('v-eq').textContent=S.eq;
  document.getElementById('v-luck').textContent=S.luck;
  document.getElementById('v-scene').textContent=rank().scene;
  const need=EXPBase(S.level);
  document.getElementById('b-exp').style.width=clamp(S.exp/need*100,0,100)+'%';
  document.getElementById('v-exp').textContent=Math.floor(S.exp)+'/'+need;
  const pill=document.getElementById('v-idle');
  pill.textContent='挂机：'+(S.idle?'开启中':'关闭');
  pill.className='idle-pill '+(S.idle?'idle-on':'idle-off');
  document.querySelectorAll('.mode').forEach(b=>b.classList.toggle('active',b.dataset.mode===S.mode));
  document.getElementById('a-work').disabled=S.energy<20;
  // bottom bar sync
  const bbWork=document.getElementById('bb-work');
  if(bbWork)bbWork.disabled=S.energy<20;
  const bbIdleT=document.getElementById('bb-idle-t');
  if(bbIdleT)bbIdleT.textContent=S.idle?'停挂机':'开挂机';
  const bbIdle=document.getElementById('bb-idle');
  if(bbIdle)bbIdle.classList.toggle('primary',!S.idle);
  const lb=document.getElementById('logbox');
  lb.innerHTML=S.log.slice(0,20).map(l=>`<div class="logline ${l.c}"><span class="t">${l.t}</span>${l.m}</div>`).join('');
}

/* ============ 事件绑定 ============ */
document.getElementById('a-work').onclick=actWork;
document.getElementById('a-moyu').onclick=actMoyu;
document.getElementById('a-tidy').onclick=actTidy;
document.getElementById('a-idle').onclick=toggleIdle;
document.getElementById('a-bag').onclick=()=>openPanel('bag');
document.getElementById('a-task').onclick=()=>openPanel('ach');
// bottom bar bindings
document.getElementById('bb-work').onclick=actWork;
document.getElementById('bb-moyu').onclick=actMoyu;
document.getElementById('bb-bag').onclick=()=>openPanel('bag');
document.getElementById('bb-idle').onclick=toggleIdle;
document.querySelectorAll('.mode').forEach(b=>b.onclick=()=>{
  S.mode=b.dataset.mode;log('⚙️ 挂机模式已切换为：'+b.textContent.trim(),'');save();render();
});
document.getElementById('p-close').onclick=()=>document.getElementById('m-panel').classList.remove('show');
document.querySelectorAll('.tab[data-tab]').forEach(t=>t.onclick=()=>{
  document.querySelectorAll('.tab[data-tab]').forEach(x=>x.classList.toggle('active',x===t));
  renderPanel(t.dataset.tab);
});
['m-event','m-panel','m-result'].forEach(id=>{
  document.getElementById(id).addEventListener('click',e=>{
    if(e.target.id===id && id!=='m-result') e.currentTarget.classList.remove('show');
  });
});

/* ============ 启动 ============ */
load();
offlineGain();
log('🐾 系统绑定成功。欢迎回到瑞众保险的入职第一天。','');
checkAch();
save();render();
setInterval(loop,TICK);
</script>
</body>
</html>
